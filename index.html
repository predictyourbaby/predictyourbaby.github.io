<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict Your Baby — Eye Color, Hair, Height & Gender Calculators</title>
<meta name="description" content="Free baby predictor calculators — estimate your baby's eye color, hair color, adult height and gender using genetics-based tools. Instant results, no signup.">
<link rel="canonical" id="canonicalTag" href="https://predictyourbaby.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC; --paper2:#F1EDE1; --ink:#242219; --ink-soft:#5C594E;
    --sage:#5F7A63; --sage-deep:#3D5240; --sage-pale:#E4EBE3;
    --coral:#C97A5A; --coral-pale:#F3E0D5;
    --line:#DFD9C8; --card:#FFFEFA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1A16; --paper2:#232019; --ink:#EEEAE0; --ink-soft:#A9A497;
      --line:#38352C; --card:#211F19;
      --sage:#8FAE93; --sage-deep:#A9C4AC; --sage-pale:#26302A;
      --coral:#DFA083; --coral-pale:#332721;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1A16; --paper2:#232019; --ink:#EEEAE0; --ink-soft:#A9A497;
    --line:#38352C; --card:#211F19;
    --sage:#8FAE93; --sage-deep:#A9C4AC; --sage-pale:#26302A;
    --coral:#DFA083; --coral-pale:#332721;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:500;margin:0;letter-spacing:-0.01em;}
  a{color:inherit;} img{max-width:100%;}

  /* ---------- Nav ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0;}
  .brand svg{width:26px;height:26px;}
  .brand-name{font-family:'Newsreader',serif;font-size:1.15rem;font-weight:600;}
  nav{display:flex;gap:2px;overflow-x:auto;}
  nav a{text-decoration:none;color:var(--ink-soft);font-size:0.9rem;padding:8px 14px;border-radius:20px;white-space:nowrap;transition:all .15s ease;}
  nav a:hover{color:var(--ink);background:var(--paper2);}
  nav a.active{color:var(--card);background:var(--sage-deep);font-weight:500;}

  main{max-width:1040px;margin:0 auto;padding:0 24px 90px;}

  /* ---------- Hero (home) ---------- */
  .hero-wrap{position:relative;padding:64px 0 40px;overflow:hidden;}
  .hero-blob{position:absolute;top:-120px;right:-100px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle, var(--coral-pale) 0%, transparent 70%);z-index:0;pointer-events:none;}
  .hero-blob2{position:absolute;bottom:-140px;left:-120px;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle, var(--sage-pale) 0%, transparent 70%);z-index:0;pointer-events:none;}
  .hero-inner{position:relative;z-index:1;}
  .eyebrow-badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage-pale);color:var(--sage-deep);
    padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:600;margin-bottom:20px;}
  .eyebrow-badge svg{width:14px;height:14px;}
  .hero-wrap h1{font-size:2.9rem;max-width:16ch;margin-bottom:16px;line-height:1.08;}
  .hero-wrap .lede{color:var(--ink-soft);max-width:52ch;line-height:1.6;font-size:1.08rem;margin-bottom:28px;}
  .trust-row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:8px;}
  .trust-item{display:flex;align-items:center;gap:7px;font-size:0.86rem;color:var(--ink-soft);}
  .trust-item svg{width:15px;height:15px;color:var(--sage-deep);flex-shrink:0;}

  /* ---------- Tool grid ---------- */
  .tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:44px 0 60px;}
  @media (max-width:760px){.tool-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:460px){.tool-grid{grid-template-columns:1fr;}}
  .tool-card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:22px 20px;transition:all .18s ease;position:relative;overflow:hidden;}
  .tool-card:hover{border-color:var(--sage);transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,0.15);}
  .tool-card .icon-wrap{width:40px;height:40px;border-radius:10px;background:var(--sage-pale);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .tool-card .icon-wrap svg{width:20px;height:20px;color:var(--sage-deep);}
  .tc-title{font-family:'Newsreader',serif;font-size:1.15rem;margin-bottom:6px;font-weight:600;}
  .tc-desc{color:var(--ink-soft);font-size:0.87rem;line-height:1.5;}
  .tc-arrow{position:absolute;top:20px;right:18px;color:var(--ink-soft);font-size:1.1rem;opacity:0;transition:opacity .15s ease;}
  .tool-card:hover .tc-arrow{opacity:1;}

  /* ---------- Section shell ---------- */
  .section{margin:60px 0;}
  .section-head{max-width:60ch;margin-bottom:28px;}
  .section-tag{color:var(--coral);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .section h2{font-size:1.7rem;margin-bottom:10px;}
  .section-sub{color:var(--ink-soft);line-height:1.6;font-size:0.98rem;}

  /* ---------- 3-step how-it-works ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:700px){.steps{grid-template-columns:1fr;}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;}
  .step-num{width:30px;height:30px;border-radius:50%;background:var(--sage-deep);color:var(--card);
    display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:600;margin-bottom:14px;font-size:0.95rem;}
  .step h3{font-size:1.05rem;margin-bottom:6px;}
  .step p{color:var(--ink-soft);font-size:0.88rem;line-height:1.55;margin:0;}

  /* ---------- Comparison table ---------- */
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
  table{width:100%;border-collapse:collapse;font-size:0.87rem;}
  th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--ink);font-weight:600;font-size:0.82rem;background:var(--paper2);}
  td{color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.76rem;font-weight:600;}
  .chip-high{background:var(--sage-pale);color:var(--sage-deep);}
  .chip-med{background:#F4E9C8;color:#8A6D1E;}
  .chip-low{background:var(--coral-pale);color:var(--coral);}

  /* ---------- Callout ---------- */
  .callout{background:var(--sage-pale);border-left:3px solid var(--sage-deep);border-radius:0 8px 8px 0;
    padding:16px 20px;margin:20px 0;}
  .callout-title{font-weight:600;font-size:0.88rem;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
  .callout-title svg{width:15px;height:15px;}
  .callout p{margin:0;font-size:0.9rem;color:var(--ink-soft);line-height:1.55;}
  .callout.coral{background:var(--coral-pale);border-left-color:var(--coral);}

  /* ---------- Tool page ---------- */
  .tool-eyebrow{color:var(--coral);font-size:0.83rem;font-weight:600;margin-bottom:9px;padding-top:36px;}
  .tool-heading{font-size:2.2rem;max-width:18ch;margin-bottom:12px;}
  .tool-sub{color:var(--ink-soft);max-width:58ch;line-height:1.55;margin-bottom:14px;}
  .accuracy-row{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  @media (max-width:540px){.field-row{grid-template-columns:1fr;}}
  .sub-label{font-size:0.78rem;color:var(--coral);margin:22px 0 12px;letter-spacing:0.04em;text-transform:uppercase;font-weight:600;}
  label{display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;}
  select,input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.94rem;}
  select:focus,input:focus{outline:2px solid var(--sage);outline-offset:1px;}
  .btn-row{display:flex;gap:10px;margin-top:8px;}
  button.go,button.reset{border:none;padding:12px 24px;border-radius:8px;font-family:inherit;
    font-size:0.94rem;font-weight:600;cursor:pointer;}
  button.go{background:var(--sage-deep);color:var(--card);}
  button.go:hover{background:var(--sage);}
  button.reset{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  button.reset:hover{color:var(--ink);}

  .result{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);display:none;}
  .result.show{display:block;}
  .result-label{font-size:0.82rem;color:var(--ink-soft);margin-bottom:14px;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
  .bar-name{width:96px;font-size:0.88rem;flex-shrink:0;}
  .bar-track{flex:1;height:11px;background:var(--paper2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width 0.6s cubic-bezier(.2,.8,.2,1);}
  .bar-pct{width:52px;text-align:right;font-size:0.84rem;color:var(--ink-soft);flex-shrink:0;}
  .big-result{font-family:'Newsreader',serif;font-size:1.8rem;margin-bottom:5px;font-weight:600;}
  .disclaimer{font-size:0.79rem;color:var(--ink-soft);margin-top:20px;line-height:1.5;}

  .insight-box{margin-top:22px;background:var(--paper2);border-radius:10px;padding:16px 18px;display:none;}
  .insight-box.show{display:block;}
  .insight-tag{display:flex;align-items:center;gap:7px;font-size:0.78rem;font-weight:700;color:var(--sage-deep);
    text-transform:uppercase;letter-spacing:0.04em;margin-bottom:7px;}
  .insight-tag svg{width:14px;height:14px;}
  .insight-box p{margin:0;font-size:0.9rem;color:var(--ink-soft);line-height:1.6;}

  /* ---------- Long-form content ---------- */
  .content{max-width:68ch;margin-top:56px;}
  .content h2{font-size:1.5rem;margin:46px 0 14px;}
  .content h2:first-child{margin-top:0;}
  .content h3{font-size:1.12rem;margin:26px 0 9px;}
  .content p{color:var(--ink-soft);line-height:1.68;margin:0 0 14px;}
  .content ul,.content ol{color:var(--ink-soft);line-height:1.75;padding-left:20px;margin:0 0 16px;}
  .content li{margin-bottom:5px;}
  .content strong{color:var(--ink);font-weight:600;}

  .swatch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0 26px;}
  .swatch{text-align:center;}
  .swatch .dot{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);margin-bottom:7px;}
  .swatch .nm{font-size:0.85rem;color:var(--ink);font-weight:600;}
  .swatch .sub{font-size:0.75rem;color:var(--ink-soft);}

  .img-slot{margin:22px 0;}
  .img-slot img{width:100%;border-radius:10px;display:block;border:1px solid var(--line);}
  .img-ph{width:100%;aspect-ratio:16/7;border-radius:10px;border:1px dashed var(--line);
    background:var(--card);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:0.82rem;text-align:center;padding:16px;}
  .img-cap{font-size:0.78rem;color:var(--ink-soft);margin-top:7px;}

  /* SVG chart */
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin:20px 0 26px;}
  .chart-title{font-size:0.85rem;font-weight:600;margin-bottom:16px;color:var(--ink);}
  .hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .hbar-label{width:110px;font-size:0.82rem;color:var(--ink-soft);flex-shrink:0;}
  .hbar-track{flex:1;height:16px;background:var(--paper2);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:8px;}
  .hbar-val{width:44px;text-align:right;font-size:0.8rem;color:var(--ink-soft);flex-shrink:0;}

  /* FAQ accordion */
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item:first-child{border-top:1px solid var(--line);}
  .faq-q{width:100%;text-align:left;background:none;border:none;padding:16px 4px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:inherit;
    font-size:0.96rem;font-weight:600;color:var(--ink);}
  .faq-q .chev{flex-shrink:0;transition:transform .2s ease;color:var(--ink-soft);}
  .faq-item.open .faq-q .chev{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .faq-item.open .faq-a{max-height:220px;}
  .faq-a p{margin:0 0 16px;padding:0 4px;font-size:0.9rem;color:var(--ink-soft);line-height:1.6;}

  .route-hint{margin-top:52px;padding:13px 16px;background:var(--paper2);border-radius:8px;
    font-size:0.78rem;color:var(--ink-soft);}
  .route-hint code{background:var(--card);padding:1px 6px;border-radius:4px;border:1px solid var(--line);}

  footer{border-top:1px solid var(--line);margin-top:70px;padding-top:24px;padding-bottom:10px;
    font-size:0.82rem;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  footer a{text-decoration:none;color:var(--ink-soft);}
  footer a:hover{color:var(--ink);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" data-link>
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--coral)" stroke-width="1.6"/><circle cx="12" cy="12" r="3.4" fill="var(--sage)"/></svg>
      <span class="brand-name">predictyourbaby</span>
    </a>
    <nav id="nav">
      <a href="/" data-link data-route="home">Home</a>
      <a href="/eye-color" data-link data-route="eye-color">Eye color</a>
      <a href="/hair" data-link data-route="hair">Hair color</a>
      <a href="/height" data-link data-route="height">Height</a>
      <a href="/gender" data-link data-route="gender">Gender</a>
    </nav>
  </div>
</div>

<main id="main"></main>

<script>
/* ============ ICONS ============ */
const ICONS = {
  check:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3.2"/></svg>',
  hair:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20c1-5 1-8 0-11 2-2 4-3 8-3s6 1 8 3c-1 3-1 6 0 11"/><path d="M8 20c.6-3 .6-5 0-8M12 20c.4-3 .4-6 0-9M16 20c-.6-3-.6-5 0-8"/></svg>',
  ruler:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/></svg>',
  gender:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="14" r="5"/><path d="M13 10l6-6M14 4h5v5"/></svg>',
  spark:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2l1.6 4.9L16.5 8.5 11.6 10 10 15l-1.6-5L3.5 8.5 8.4 6.9 10 2z"/></svg>',
  bulb:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a6 6 0 00-3.5 10.9c.4.3.5.7.5 1.1v.5h6v-.5c0-.4.1-.8.5-1.1A6 6 0 0010 2zM8 16h4v1a2 2 0 01-4 0v-1z"/></svg>',
  lock:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 8V6a5 5 0 0110 0v2h1a1 1 0 011 1v8a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1h1zm2 0h6V6a3 3 0 00-6 0v2z"/></svg>'
};

/* ============ IMAGE SLOTS ============ */
const IMG = {
  heroFamily:{src:"images/family-hero.webp",alt:"Parents holding a newborn baby"},
  eyeNewborn:{src:"images/newborn-eyes.webp",alt:"Close-up of a newborn baby's eyes"},
  hairBaby:{src:"images/baby-hair.webp",alt:"Baby with light hair"},
  heightFamily:{src:"images/measuring-height.webp",alt:"Child being measured against a height chart"},
  genderUltra:{src:"images/ultrasound.webp",alt:"Prenatal ultrasound scan image"}
};
function img(key){
  const i = IMG[key];
  return `<div class="img-slot"><img src="${i.src}" alt="${i.alt}" loading="lazy"
    onerror="this.outerHTML='<div class=\\'img-ph\\'>Image slot — replace with: ${i.src}</div>'">
    <div class="img-cap">${i.alt}</div></div>`;
}

/* ============ SVG BAR CHART ============ */
function hbarChart(title, data){
  const max = Math.max(...data.map(d=>d.val));
  return `<div class="chart-wrap"><div class="chart-title">${title}</div>
    ${data.map(d=>`<div class="hbar-row">
      <div class="hbar-label">${d.label}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(d.val/max*100).toFixed(0)}%;background:${d.color}"></div></div>
      <div class="hbar-val">${d.val}%</div>
    </div>`).join('')}</div>`;
}

/* ============ FAQ ACCORDION + SCHEMA ============ */
function faqBlock(items){
  const html = items.map((f,i)=>`
    <div class="faq-item" data-i="${i}">
      <button class="faq-q" type="button">${f.q}<span class="chev">+</span></button>
      <div class="faq-a"><p>${f.a}</p></div>
    </div>`).join('');
  return `<div class="faq-list">${html}</div>`;
}
function bindFaq(){
  document.querySelectorAll('.faq-q').forEach(btn=>{
    btn.onclick = () => btn.parentElement.classList.toggle('open');
  });
}
function faqSchema(items){
  const data = {"@context":"https://schema.org","@type":"FAQPage",
    "mainEntity": items.map(f=>({"@type":"Question","name":f.q,
      "acceptedAnswer":{"@type":"Answer","text":f.a.replace(/<[^>]*>/g,'')}}))};
  return `<script type="application/ld+json">${JSON.stringify(data)}<\/script>`;
}

const colorOptions = ["Brown","Hazel","Green","Blue","Gray","Amber"];
const hairOptions = ["Black","Dark Brown","Light Brown","Blonde","Red"];
const unknownFirst = list => `<option value="">Unknown / not sure</option>` + list.map(c=>`<option value="${c}">${c}</option>`).join('');
const opts = list => list.map(c=>`<option value="${c}">${c}</option>`).join('');

/* ===================== FAQ DATA ===================== */
const homeFaq = [
  {q:"Are these calculators free?", a:"Yes — all four tools are completely free with no registration, payment, or email required."},
  {q:"How accurate are the predictions?", a:"They reflect established inheritance patterns but are estimates, not guarantees. The height calculator is the most evidence-based of the four; the gender predictor is folklore and not accurate at all."},
  {q:"Can I use them before the baby is born?", a:"Yes. The eye, hair and height tools only need information about the parents, so you can use them at any point — including before conception."},
  {q:"Do they work on mobile?", a:"Yes, all tools are fully responsive and work in any modern mobile or desktop browser without an app."},
  {q:"Should these results influence medical decisions?", a:"No. These are educational and entertainment tools. For anything involving genetic conditions or pregnancy planning, speak with a doctor or genetic counselor."}
];
const eyeFaq = [
  {q:"Can two blue-eyed parents have a brown-eyed baby?", a:"It's uncommon but genuinely possible. If each parent carries a brown-eye allele that's suppressed in them, a child inheriting it from both can express brown."},
  {q:"Can two brown-eyed parents have a blue-eyed baby?", a:"Yes, and it's more common than the reverse. If both parents carry a recessive blue allele — often visible in a blue-eyed grandparent — roughly one in four of their children may have blue eyes."},
  {q:"What's the rarest eye color?", a:"Among standard colors, green is the rarest at about 2 percent of people worldwide. Gray and amber are also uncommon."},
  {q:"Why do the grandparent fields say optional?", a:"The calculator produces a result from the parents alone. Grandparent data improves accuracy by revealing recessive genes, but it isn't required."},
  {q:"Does this calculator store what I enter?", a:"No. Everything runs in your browser — nothing is sent to a server, saved, or linked to you."},
  {q:"Is the calculator medically accurate?", a:"It reflects established inheritance patterns but isn't a genetic test. For questions about inherited eye conditions, consult an ophthalmologist or genetic counselor."}
];
const hairFaqData = [

    </div>`;
  document.getElementById('p2').selectedIndex = 3;

    ['p1','p2'].forEach(id=>{ const v=document.getElementById(id).value; if(v){pool.push(v);pool.push(v);} });

    text += `Remember this is a tendency across many families with this profile, not a guarantee for your specific child.`;
    document.getElementById('insightText').textContent = text;
    document.getElementById('insight').classList.add('show');
  };
}

    document.getElementById('hrange').textContent = `Likely range: ${(est-8.5).toFixed(0)}–${(est+8.5).toFixed(0)} cm (${ft(est-8.5)} – ${ft(est+8.5)})`;
    document.getElementById('result').classList.add('show');
    const taller = mh > fh ? 'mother' : fh > mh ? 'father' : 'parents are the same height, so';
    let text = `Averaging ${mh} cm and ${fh} cm, then adjusting for a ${sex}, lands the estimate at ${est.toFixed(0)} cm. `;
    text += mh!==fh ? `The ${taller} is taller, which nudges the range slightly in that direction. ` : ``;

    document.getElementById('insightText').textContent = text;

function showBars(weights, order, colors){
  const total = Object.values(weights).reduce((a,b)=>a+b,0);
  const sorted = order.map(k=>({name:k, val: total ? (weights[k]/total)*100 : 0})).sort((a,b)=>b.val-a.val);
  document.getElementById('bars').innerHTML = sorted.map(b=>`<div class="bar-row">
      <div class="bar-name">${b.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${b.val.toFixed(1)}%;background:${colors[b.name]}"></div></div>
      <div class="bar-pct">${b.val.toFixed(1)}%</div>
    </div>`).join('');
  document.getElementById('result').classList.add('show');
  return sorted[0];
}

    <h2>When does a baby's eye color settle?</h2>

    <p>Many babies, particularly of European descent, are born with grayish or slate-blue eyes regardless of their eventual color. Melanin production in the iris isn't complete at birth and increases with light exposure over the following months. Most children settle into their permanent color by their first birthday, though some continue shifting until around age three.</p>

    <h2>Limitations of eye color prediction</h2>
    <ul>
      <li><strong>Polygenic complexity</strong> — over a dozen genes contribute, and most interactions aren't fully mapped.</li>
      <li><strong>Hidden recessive alleles</strong> — parents can carry colors they don't display.</li>

      <li><strong>Subjective labeling</strong> — "hazel," "light brown" and "green" are used inconsistently.</li>

function contentHair(){

    <h2>How to use the baby hair color predictor</h2>
    <ol>
      <li><strong>Select the father's natural hair color</strong> — his childhood color if you know it.</li>
      <li><strong>Select the mother's natural hair color</strong> the same way.</li>

      <li><strong>Press Calculate</strong> to see the probability of each shade, plus a plain-language summary.</li>

    <div class="callout"><div class="callout-title">${ICONS.bulb}Tip</div><p>Use natural, undyed color, and where possible each parent's color as a young child — hair often darkens with age, so an adult's current shade can understate the darker genes they carry.</p></div>

    <h2>How baby hair color is inherited</h2>
    <p>Hair color comes from two pigments. <strong>Eumelanin</strong> produces black and brown; its near-absence produces blonde. <strong>Pheomelanin</strong> produces red and golden tones. Darker alleles are generally dominant, which is why two dark-haired parents most often have dark-haired children.</p>

    ${hbarChart("World hair color distribution (approximate)", [

      {label:"Other", val:4.5, color:"#8A6440"}

    <h3>Red hair and the MC1R gene</h3>
    <p>Red hair is linked to recessive variants of <strong>MC1R</strong> — a child needs the variant from both parents to have visibly red hair, which is why it can appear in a family of brunettes when both parents are silent carriers. Roughly 1–2% of people worldwide have red hair, rising to around 10% in Ireland and Scotland.</p>

    <div class="table-wrap">

    <h2>Will my baby's hair color change?</h2>
    ${img('hairBaby')}
    <p>Almost certainly. Many babies are born with fine, light hair that falls out within months (a normal process called telogen effluvium) and regrows in a different color and texture. The general pattern is darkening — a child blonde at three may be light brown at ten and dark brown as an adult. Red hair tends to be more stable once established.</p>

    <h2>Limitations of hair color prediction</h2>
    <ul>
      <li><strong>Adult color misleads</strong> — using current rather than childhood color is the most common source of error.</li>
      <li><strong>Many genes, small effects</strong> — beyond MC1R, most contributing genes can't be inferred from appearance.</li>
      <li><strong>Baby hair is temporary</strong> — birth color often has little relationship to the eventual adult color.</li>

function contentHeight(){
  return `
    <h2>How to use the baby height predictor</h2>
    <ol>
      <li><strong>Enter the mother's height in centimeters</strong> (feet × 30.48 + inches × 2.54 if converting).</li>
      <li><strong>Enter the father's height in centimeters.</strong></li>
      <li><strong>Select the baby's sex</strong> — adult men and women differ in average height by about 13 cm.</li>
      <li><strong>Press Calculate</strong> to see the estimated adult height, its range, and what it means.</li>
    </ol>
    <div class="callout"><div class="callout-title">${ICONS.bulb}Tip</div><p>Measure without shoes. A 2 cm error in a parent's height shifts the child's estimate by about 1 cm.</p></div>

    <h2>How the mid-parental height method works</h2>
    <ul>
      <li><strong>For boys:</strong> (mother's height + father's height) ÷ 2, then add 6.5 cm</li>
      <li><strong>For girls:</strong> (mother's height + father's height) ÷ 2, then subtract 6.5 cm</li>
    </ul>
    <p>The result is a midpoint — roughly 68% of children land within ±8.5 cm of it, which is why the calculator reports a range rather than one number.</p>

    ${hbarChart("Share of adult height explained by genetics vs environment", [
      {label:"Genetics", val:70, color:"#5F7A63"},
      {label:"Environment", val:30, color:"#C97A5A"}
    ])}

    <h2>How much of height is genetic?</h2>
    <p>Twin studies attribute roughly 60–80% of height variation to genetics, spread across over 700 identified genetic variants — unlike eye color, no small set of genes dominates. The rest comes from nutrition, sleep, chronic illness and hormonal factors during the growing years.</p>

    <h2>When do children stop growing?</h2>
    ${img('heightFamily')}
    <p>Girls typically finish growing between 14–16, boys between 16–18, when growth plates close under the influence of puberty hormones. Growth isn't steady — infants grow ~25 cm in year one, slow to 5–6 cm/year in mid-childhood, then spurt 8–12 cm/year at puberty's peak.</p>

    <h2>Limitations of height prediction</h2>
    <ul>
      <li><strong>It's a statistical midpoint</strong> — individual outcomes vary widely within the normal range.</li>
      <li><strong>It assumes typical growth conditions</strong> — chronic illness or nutritional shortfalls aren't accounted for.</li>
      <li><strong>It can't detect medical causes</strong> — growth hormone deficiency requires clinical evaluation, not a formula.</li>
    </ul>

    <h2>Frequently asked questions</h2>
    ${faqBlock(heightFaqData)}
  `;
}

function contentGender(){
  return `
    <h2>How to use the baby gender predictor</h2>
    <ol>
      <li><strong>Enter the mother's age at conception</strong> in years.</li>
      <li><strong>Select the month of conception</strong> — roughly two weeks after the last period, not the month of the positive test.</li>
      <li><strong>Press Calculate</strong> to see the chart's result.</li>
    </ol>
    <div class="callout coral"><div class="callout-title">${ICONS.bulb}Be honest with yourself</div><p>This tool is entertainment. It has no scientific basis. If you want to actually know, an ultrasound or a prenatal blood test through your doctor is the answer.</p></div>

    <h2>Where the Chinese gender chart comes from</h2>
    <p>Said to date back centuries, the chart cross-references the mother's lunar age against the lunar month of conception. Studies examining its accuracy against real birth outcomes find it performs at approximately chance — about the same as a coin flip.</p>

    ${hbarChart("Chinese gender chart accuracy vs a coin flip", [
      {label:"Chart claims", val:90, color:"#C97A5A"},
      {label:"Studies find", val:50, color:"#5F7A63"}
    ])}

    <h2>What actually determines a baby's sex</h2>
    <p>The mother's egg always carries an X chromosome. The father's sperm carries X or Y — X produces a girl (XX), Y produces a boy (XY). It's effectively a coin flip at conception, with a slight, consistent global skew toward boys (~105:100).</p>

    <h3>Old wives' tales you'll hear</h3>
    <ul>
      <li><strong>Bump shape</strong> reflects muscle tone and position, not sex.</li>
      <li><strong>Fetal heart rate above 140 bpm = girl</strong> has been tested repeatedly and doesn't hold up.</li>
      <li><strong>Morning sickness severity</strong> has at most a very weak association, too small to predict any individual pregnancy.</li>
      <li><strong>The ring test</strong> swings from involuntary hand movements, not the baby.</li>
    </ul>

    <h2>How to actually find out</h2>
    ${img('genderUltra')}
    <p><strong>Ultrasound</strong> around 18–20 weeks usually identifies sex with high accuracy. <strong>NIPT</strong> (a maternal blood test) can often determine it from around 10 weeks. <strong>Amniocentesis/CVS</strong> are definitive but only performed for genuine medical indications. Ask your doctor which options are available to you.</p>

    <h2>Frequently asked questions</h2>
    ${faqBlock(genderFaqData)}
  `;
}

/* ===================== ROUTER (real URLs, pushState) ===================== */
function currentPath(){
  return window.location.pathname.replace(/^\/|\/$/g,'');
}
function navigate(to){
  if(to !== window.location.pathname) history.pushState({}, '', to);
  renderRoute();
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-link]');
  if(a){ e.preventDefault(); navigate(a.getAttribute('href')); }
});
window.addEventListener('popstate', renderRoute);

function renderRoute(){
  let key = currentPath();
  if(!(key in routes)) key = "";
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.dataset.route === (key || 'home')));

  const r = routes[key];
  const main = document.getElementById('main');
  document.title = r.title;
  document.querySelector('meta[name="description"]').setAttribute('content', r.desc);
  document.getElementById('canonicalTag').setAttribute('href', 'https://predictyourbaby.com/' + key);

  document.querySelectorAll('script[data-schema]').forEach(s=>s.remove());

  if(r.isHome){
    renderHome(main);
    const ld = document.createElement('script');
    ld.type = 'application/ld+json'; ld.dataset.schema = '1';
    ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"WebSite","name":"predictyourbaby",
      "url":"https://predictyourbaby.com/"});
    document.head.appendChild(ld);
    const ld2 = document.createElement('div');
    ld2.innerHTML = faqSchema(homeFaq); ld2.dataset.schema = '1';
    document.head.appendChild(ld2.firstElementChild);
    return;
  }

  main.innerHTML = `
    <div class="tool-eyebrow">${r.eyebrow}</div>
    <h1 class="tool-heading">${r.heading}</h1>
    <p class="tool-sub">${r.sub}</p>
    <div class="accuracy-row">${accuracyChip(r.accuracy)}</div>
    <div class="panel" id="panel"></div>
    <div class="content">${r.content()}</div>
    <footer><span>© 2026 predictyourbaby · Educational and entertainment use only · Not medical advice</span><span><a href="/" data-link>Home</a></span></footer>
  `;
  r.render(document.getElementById('panel'));
  bindFaq();
  const schemaHolder = document.createElement('div');
  schemaHolder.innerHTML = faqSchema(r.faq); schemaHolder.firstElementChild.dataset.schema='1';
  document.head.appendChild(schemaHolder.firstElementChild);
}

window.addEventListener('DOMContentLoaded', renderRoute);
</script>
