<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict Your Baby — Eye Color, Hair, Height & Gender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#26241F;
    --ink-soft:#5C594F;
    --sage:#5F7A63;
    --sage-deep:#42583F;
    --coral:#C97B5C;
    --line:#DEDACB;
    --card:#FFFEFA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Newsreader', serif;
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}

  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar-inner{
    max-width:920px;
    margin:0 auto;
    padding:20px 24px 0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--coral);
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Newsreader', serif;
    font-size:1.15rem;
    font-weight:500;
  }

  nav{
    display:flex;
    gap:2px;
    overflow-x:auto;
  }
  nav a{
    text-decoration:none;
    color:var(--ink-soft);
    font-size:0.95rem;
    padding:11px 18px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    transition:color 0.15s ease;
  }
  nav a:hover{ color:var(--ink); }
  nav a.active{
    color:var(--sage-deep);
    border-bottom:2px solid var(--sage-deep);
    font-weight:500;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:48px 24px 80px;
  }

  .tool-eyebrow{
    color:var(--coral);
    font-size:0.85rem;
    margin-bottom:10px;
  }
  .tool-heading{
    font-size:2.1rem;
    max-width:14ch;
    margin-bottom:14px;
  }
  .tool-sub{
    color:var(--ink-soft);
    max-width:52ch;
    line-height:1.55;
    margin-bottom:40px;
    font-size:1rem;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px;
  }
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  @media (max-width:520px){
    .field-row{ grid-template-columns:1fr; }
  }
  label{
    display:block;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  select, input[type=number]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
  }
  select:focus, input:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }

  button.go{
    background:var(--sage-deep);
    color:var(--paper);
    border:none;
    padding:12px 22px;
    border-radius:4px;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    font-weight:500;
    cursor:pointer;
    margin-top:6px;
  }
  button.go:hover{ background:var(--sage); }

  .result{
    margin-top:28px;
    padding-top:24px;
    border-top:1px solid var(--line);
    display:none;
  }
  .result.show{ display:block; }
  .result-label{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .bar-name{
    width:80px;
    font-size:0.9rem;
    flex-shrink:0;
  }
  .bar-track{
    flex:1;
    height:10px;
    background:var(--paper);
    border-radius:5px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:5px;
    transition:width 0.5s ease;
  }
  .bar-pct{
    width:44px;
    text-align:right;
    font-size:0.85rem;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .big-result{
    font-family:'Newsreader', serif;
    font-size:1.8rem;
    margin-bottom:6px;
  }
  .disclaimer{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:22px;
  }

  .route-note{
    margin-top:56px;
    padding:16px 18px;
    border:1px dashed var(--line);
    border-radius:6px;
    font-size:0.85rem;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .route-note code{
    background:var(--paper);
    padding:1px 5px;
    border-radius:3px;
    font-size:0.8rem;
  }

  /* Home page */
  .hero{
    max-width:34ch;
    margin-bottom:44px;
  }
  .hero h1{
    font-size:2.4rem;
    margin-bottom:16px;
  }
  .hero p{
    color:var(--ink-soft);
    line-height:1.6;
    font-size:1.05rem;
  }
  .tool-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:56px;
  }
  @media (max-width:560px){
    .tool-grid{ grid-template-columns:1fr; }
  }
  .tool-card{
    display:block;
    text-decoration:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:24px;
    transition:border-color 0.15s ease;
  }
  .tool-card:hover{ border-color:var(--sage); }
  .tool-card .tc-title{
    font-family:'Newsreader', serif;
    font-size:1.25rem;
    margin-bottom:8px;
  }
  .tool-card .tc-desc{
    color:var(--ink-soft);
    font-size:0.9rem;
    line-height:1.5;
  }
  .home-section{
    margin-bottom:40px;
    max-width:64ch;
  }
  .home-section h2{
    font-size:1.35rem;
    margin-bottom:14px;
  }
  .home-section p{
    color:var(--ink-soft);
    line-height:1.65;
    margin:0 0 14px;
  }
  .home-section ul{
    color:var(--ink-soft);
    line-height:1.7;
    padding-left:20px;
    margin:0;
  }

  /* SEO content under each calculator */
  .seo-content{
    max-width:64ch;
    margin-top:56px;
  }
  .seo-content h2{
    font-size:1.35rem;
    margin-bottom:14px;
    margin-top:40px;
  }
  .seo-content h2:first-child{ margin-top:0; }
  .seo-content p{
    color:var(--ink-soft);
    line-height:1.65;
    margin:0 0 14px;
  }
  .seo-content ol, .seo-content ul{
    color:var(--ink-soft);
    line-height:1.75;
    padding-left:20px;
    margin:0 0 14px;
  }
  .faq-item{
    margin-bottom:18px;
  }
  .faq-q{
    font-weight:500;
    color:var(--ink);
    margin-bottom:5px;
  }
  .faq-a{
    color:var(--ink-soft);
    line-height:1.6;
    font-size:0.95rem;
    margin:0;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">predictyourbaby</div>
    </div>
    <nav id="nav">
      <a href="#/" data-route="home">Home</a>
      <a href="#/eye-color" data-route="eye-color">Eye color</a>
      <a href="#/hair" data-route="hair">Hair color</a>
      <a href="#/height" data-route="height">Height</a>
      <a href="#/gender" data-route="gender">Gender</a>
    </nav>
  </div>
</div>

<main id="main"></main>

<script>
const colorOptions = ["Brown","Hazel","Green","Blue","Gray","Amber"];
const hairOptions = ["Black","Dark Brown","Light Brown","Blonde","Red"];

const routes = {
  "home": {
    isHome: true
  },
  "eye-color": {
    eyebrow: "Genetics calculator",
    heading: "Baby eye color predictor",
    sub: "Choose both parents' eye colors to see the likely range for your baby. Grandparent colors can sharpen the estimate, but aren't required.",
    render: renderEyeColor,
    seo: seoEyeColor
  },
  "hair": {
    eyebrow: "Genetics calculator",
    heading: "Baby hair color predictor",
    sub: "Pick both parents' natural hair color to estimate the probability spread for your baby's hair.",
    render: renderHair,
    seo: seoHair
  },
  "height": {
    eyebrow: "Growth calculator",
    heading: "Baby height predictor",
    sub: "Enter both parents' heights to estimate your child's likely adult height using the mid-parental height method.",
    render: renderHeight,
    seo: seoHeight
  },
  "gender": {
    eyebrow: "For fun",
    heading: "Baby gender predictor",
    sub: "A lighthearted estimate based on mother's age and month of conception — not a medical or scientific method.",
    render: renderGender,
    seo: seoGender
  }
};

function renderHome(main){
  main.innerHTML = `
    <div class="hero">
      <h1>Get a first glimpse of your baby, four ways</h1>
      <p>Four simple calculators for expecting and hoping parents — grounded in genetics and growth patterns, explained in plain language, free to use.</p>
    </div>

    <div class="tool-grid">
      <a href="#/eye-color" class="tool-card">
        <div class="tc-title">Eye color</div>
        <div class="tc-desc">See the likely spread of eye colors based on both parents.</div>
      </a>
      <a href="#/hair" class="tool-card">
        <div class="tc-title">Hair color</div>
        <div class="tc-desc">Estimate your baby's most likely hair shades.</div>
      </a>
      <a href="#/height" class="tool-card">
        <div class="tc-title">Height</div>
        <div class="tc-desc">Project adult height using the mid-parental method.</div>
      </a>
      <a href="#/gender" class="tool-card">
        <div class="tc-title">Gender</div>
        <div class="tc-desc">A fun, folklore-based guess — not a medical test.</div>
      </a>
    </div>

    <div class="home-section">
      <h2>How these predictors work</h2>
      <p>Each calculator uses a different, purpose-built method. The eye and hair color tools apply dominance patterns from genetics — some colors are more likely to appear in a child when a parent carries them, based on how those traits are typically inherited. The height calculator uses the mid-parental height method, a formula doctors and pediatricians have used for decades to give a reasonable adult-height estimate from both parents' heights. The gender predictor is different: it's based on a traditional folklore chart, included for fun rather than as a scientific method.</p>
      <p>None of these tools replace medical testing, genetic counseling, or an ultrasound. They're designed to be a starting point for curiosity — something to explore together before your appointments confirm the details.</p>
    </div>

    <div class="home-section">
      <h2>Why results are a range, not a guarantee</h2>
      <p>Traits like eye and hair color are influenced by more than one gene, and not every gene involved is fully understood or visible from a parent's own appearance. That's why each calculator shows a probability spread instead of a single answer — it reflects the real uncertainty in inherited traits rather than pretending to know more than the science does.</p>
    </div>
  `;
}

function optionsHTML(list, id){
  return list.map(c => `<option value="${c}">${c}</option>`).join('');
}

function renderEyeColor(container){
  container.innerHTML = `
    <div class="field-row">
      <div>
        <label for="p1">Parent 1 eye color</label>
        <select id="p1">${optionsHTML(colorOptions)}</select>
      </div>
      <div>
        <label for="p2">Parent 2 eye color</label>
        <select id="p2" data-default="1">${optionsHTML(colorOptions)}</select>
      </div>
    </div>
    <button class="go" id="calc">Calculate</button>
    <div class="result" id="result">
      <div class="result-label">Estimated probability</div>
      <div id="bars"></div>
      <div class="disclaimer">Based on general dominance patterns (brown &gt; green/hazel &gt; blue). Real inheritance involves multiple genes — treat this as a fun estimate, not a guarantee.</div>
    </div>
  `;
  document.getElementById('p2').selectedIndex = 3;
  document.getElementById('calc').addEventListener('click', () => {
    const p1 = document.getElementById('p1').value;
    const p2 = document.getElementById('p2').value;
    const weights = {Brown:0,Hazel:0,Green:0,Blue:0,Gray:0,Amber:0};
    const dark = ["Brown","Amber"];
    const mid = ["Hazel","Green"];
    const light = ["Blue","Gray"];
    const classify = c => dark.includes(c) ? 'dark' : mid.includes(c) ? 'mid' : 'light';
    const c1 = classify(p1), c2 = classify(p2);
    if(c1==='dark' && c2==='dark'){ weights.Brown=65; weights.Hazel=15; weights.Amber=10; weights.Green=5; weights.Blue=3; weights.Gray=2; }
    else if((c1==='dark'&&c2==='mid')||(c1==='mid'&&c2==='dark')){ weights.Brown=45; weights.Hazel=25; weights.Green=15; weights.Amber=5; weights.Blue=7; weights.Gray=3; }
    else if((c1==='dark'&&c2==='light')||(c1==='light'&&c2==='dark')){ weights.Brown=35; weights.Blue=25; weights.Hazel=15; weights.Green=12; weights.Gray=8; weights.Amber=5; }
    else if(c1==='mid' && c2==='mid'){ weights.Hazel=35; weights.Green=30; weights.Brown=20; weights.Blue=10; weights.Gray=3; weights.Amber=2; }
    else if((c1==='mid'&&c2==='light')||(c1==='light'&&c2==='mid')){ weights.Green=30; weights.Blue=28; weights.Hazel=22; weights.Gray=12; weights.Brown=6; weights.Amber=2; }
    else { weights.Blue=55; weights.Gray=20; weights.Green=15; weights.Hazel=7; weights.Brown=2; weights.Amber=1; }
    showBars(weights);
  });
}

function renderHair(container){
  container.innerHTML = `
    <div class="field-row">
      <div>
        <label for="h1">Parent 1 hair color</label>
        <select id="h1">${optionsHTML(hairOptions)}</select>
      </div>
      <div>
        <label for="h2">Parent 2 hair color</label>
        <select id="h2">${optionsHTML(hairOptions)}</select>
      </div>
    </div>
    <button class="go" id="calc">Calculate</button>
    <div class="result" id="result">
      <div class="result-label">Estimated probability</div>
      <div id="bars"></div>
      <div class="disclaimer">Dark hair genes tend to dominate lighter ones. Hair often darkens naturally in the first few years regardless of this estimate.</div>
    </div>
  `;
  document.getElementById('h2').selectedIndex = 3;
  document.getElementById('calc').addEventListener('click', () => {
    const order = ["Black","Dark Brown","Light Brown","Blonde","Red"];
    const h1 = document.getElementById('h1').value;
    const h2 = document.getElementById('h2').value;
    const i1 = order.indexOf(h1), i2 = order.indexOf(h2);
    const avg = (i1+i2)/2;
    const weights = {};
    order.forEach((c,i) => {
      const dist = Math.abs(i - avg);
      weights[c] = Math.max(0, 40 - dist*15);
    });
    if(h1==='Red'||h2==='Red') weights['Red'] = Math.max(weights['Red'], 20);
    showBars(weights, order);
  });
}

function renderHeight(container){
  container.innerHTML = `
    <div class="field-row">
      <div>
        <label for="mh">Mother's height (cm)</label>
        <input type="number" id="mh" placeholder="e.g. 165" min="120" max="210">
      </div>
      <div>
        <label for="fh">Father's height (cm)</label>
        <input type="number" id="fh" placeholder="e.g. 178" min="120" max="220">
      </div>
    </div>
    <div class="field-row">
      <div>
        <label for="gender">Baby's sex</label>
        <select id="gender">
          <option value="boy">Boy</option>
          <option value="girl">Girl</option>
        </select>
      </div>
      <div></div>
    </div>
    <button class="go" id="calc">Calculate</button>
    <div class="result" id="result">
      <div class="result-label">Estimated adult height</div>
      <div class="big-result" id="heightResult"></div>
      <div class="disclaimer">Calculated using the mid-parental height method (± 8.5 cm typical range). Actual height depends on nutrition, health, and other genetic factors.</div>
    </div>
  `;
  document.getElementById('calc').addEventListener('click', () => {
    const mh = parseFloat(document.getElementById('mh').value);
    const fh = parseFloat(document.getElementById('fh').value);
    const gender = document.getElementById('gender').value;
    if(!mh || !fh){ return; }
    let est;
    if(gender === 'boy') est = (mh + fh)/2 + 6.5;
    else est = (mh + fh)/2 - 6.5;
    const low = (est - 8.5).toFixed(0);
    const high = (est + 8.5).toFixed(0);
    document.getElementById('heightResult').textContent = `${est.toFixed(0)} cm  (likely range ${low}–${high} cm)`;
    document.getElementById('result').classList.add('show');
  });
}

function renderGender(container){
  container.innerHTML = `
    <div class="field-row">
      <div>
        <label for="age">Mother's age at conception</label>
        <input type="number" id="age" placeholder="e.g. 29" min="15" max="55">
      </div>
      <div>
        <label for="month">Month of conception</label>
        <select id="month">
          ${["January","February","March","April","May","June","July","August","September","October","November","December"].map(m=>`<option>${m}</option>`).join('')}
        </select>
      </div>
    </div>
    <button class="go" id="calc">Calculate</button>
    <div class="result" id="result">
      <div class="result-label">Estimated result</div>
      <div class="big-result" id="genderResult"></div>
      <div class="disclaimer">Based on the traditional "Chinese gender chart" method — folklore, not science. For a real answer, an ultrasound or blood test is the accurate route.</div>
    </div>
  `;
  document.getElementById('calc').addEventListener('click', () => {
    const age = parseInt(document.getElementById('age').value);
    const month = document.getElementById('month').selectedIndex + 1;
    if(!age){ return; }
    const isBoy = (age + month) % 2 === 0;
    document.getElementById('genderResult').textContent = isBoy ? "Boy — slightly more likely" : "Girl — slightly more likely";
    document.getElementById('result').classList.add('show');
  });
}

function showBars(weights, order){
  const total = Object.values(weights).reduce((a,b)=>a+b,0);
  const keys = order || Object.keys(weights);
  const palette = ["#5F7A63","#C97B5C","#8B9A7A","#B08968","#7C9885","#A6785F"];
  const barsHTML = keys
    .map((k,i) => ({name:k, val: total ? Math.round((weights[k]/total)*100) : 0, color: palette[i % palette.length]}))
    .sort((a,b)=>b.val - a.val)
    .map(b => `
      <div class="bar-row">
        <div class="bar-name">${b.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${b.val}%;background:${b.color}"></div></div>
        <div class="bar-pct">${b.val}%</div>
      </div>
    `).join('');
  document.getElementById('bars').innerHTML = barsHTML;
  document.getElementById('result').classList.add('show');
}

function seoEyeColor(){
  return `
    <h2>How to use the eye color predictor</h2>
    <ol>
      <li>Select the eye color of Parent 1 from the dropdown.</li>
      <li>Select the eye color of Parent 2.</li>
      <li>Press Calculate to see a probability breakdown for your baby's eye color.</li>
    </ol>
    <p>The result shows a percentage for each possible eye color, ranked from most to least likely. There's no login, no email, and no data saved — you can run it as many times as you like with different combinations.</p>

    <h2>How baby eye color inheritance works</h2>
    <p>Eye color is determined by several genes working together, though two — OCA2 and HERC2 — play the largest role. These genes control how much melanin, a natural pigment, is produced and deposited in the iris. More melanin generally means darker eyes; less melanin means lighter eyes, with blue appearing when there's very little pigment for light to scatter against.</p>
    <p>Brown is the most common eye color worldwide and tends to be genetically dominant, meaning a baby is more likely to inherit brown eyes if even one parent has them. Blue and green are recessive in most models, which is why two blue-eyed parents are far more likely to have a blue-eyed baby than two brown-eyed parents are to have one.</p>

    <h2>Why newborn eye color often changes</h2>
    <p>Many babies are born with a grayish-blue tint regardless of what color their eyes will eventually be. That's because melanin production in the iris isn't finished at birth — it continues to develop over the first six to twelve months, and sometimes up to three years. This is why a baby's "final" eye color is usually clearer well after their first birthday.</p>

    <div class="faq-item">
      <div class="faq-q">Can two blue-eyed parents have a brown-eyed baby?</div>
      <p class="faq-a">It's uncommon but not impossible. Eye color involves multiple genes, and a parent can carry hidden genetic variations that don't show in their own eye color but can still be passed on.</p>
    </div>
    <div class="faq-item">
      <div class="faq-q">Does grandparents' eye color matter?</div>
      <p class="faq-a">Yes — recessive traits can skip a generation. A grandparent's eye color can indicate genes a parent carries but doesn't visibly express.</p>
    </div>
    <div class="faq-item">
      <div class="faq-q">Is this calculator medically accurate?</div>
      <p class="faq-a">It reflects general inheritance patterns, not a lab-based genetic test. Treat it as an estimate for fun and curiosity, not a diagnostic tool.</p>
    </div>
  `;
}

function seoHair(){
  return `
    <h2>How to use the hair color predictor</h2>
    <ol>
      <li>Choose Parent 1's natural hair color.</li>
      <li>Choose Parent 2's natural hair color.</li>
      <li>Press Calculate to view the likelihood of each possible shade.</li>
    </ol>
    <p>Use each parent's natural childhood hair color where possible, since hair often darkens with age — using a parent's current color can skew the estimate lighter than it should be.</p>

    <h2>How baby hair color inheritance works</h2>
    <p>Hair color, like eye color, is controlled by multiple genes rather than a single one, with melanin again playing the central role. Darker hair colors are generally associated with more dominant gene variants, which is why two dark-haired parents are more likely to have a dark-haired child, while lighter shades like blonde and red tend to require both parents to carry the recessive version of the gene involved.</p>
    <p>Red hair is a special case — it's linked to a specific recessive gene (MC1R), so it can appear even when neither parent has visibly red hair, as long as both are carriers.</p>

    <h2>Will my baby's hair color change?</h2>
    <p>Yes, often significantly. Many babies are born with lighter or thinner hair than they'll eventually have, and hair color can shift multiple times through early childhood as melanin production matures. A baby born with light or no hair may still develop a noticeably darker shade by age two or three.</p>

    <div class="faq-item">
      <div class="faq-q">Why was my baby born with different hair than either parent?</div>
      <p class="faq-a">Hair color genes can be recessive and hidden across generations, plus early infant hair texture and color are often temporary and change over the first years.</p>

      <div class="faq-q">Can two brunette parents have a blonde baby?</div>
      <p class="faq-a">Yes, if both parents carry a recessive lighter-hair gene even though it isn't visibly expressed in their own hair.</p>
    </div>
  `;
}

    <p>This predictor is based on the traditional "Chinese gender chart," a folk method said to be centuries old, which cross-references the mother's lunar age with the lunar month of conception. It has no basis in medical science and hasn't been shown to predict outcomes better than chance in controlled studies — it's included here as a lighthearted tradition many expecting parents enjoy trying, not as a reliable method.</p>

    <h2>What actually determines a baby's biological sex</h2>
    <p>A baby's sex is determined at conception by which chromosome the father's sperm contributes — an X chromosome results in a girl (XX), and a Y chromosome results in a boy (XY). The mother always contributes an X chromosome, so the father's contribution is what determines the outcome. This is a fixed biological process and isn't influenced by age, timing, diet, or any of the folk methods historically used to guess it in advance.</p>

    <div class="faq-item">
      <div class="faq-q">Is the Chinese gender chart accurate?</div>

function renderRoute(){
  let hash = window.location.hash.replace('#/', '') || 'home';
  if(!routes[hash]) hash = 'home';

  document.querySelectorAll('nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.route === hash);
  });

  const r = routes[hash];
  const main = document.getElementById('main');

  if(r.isHome){
    renderHome(main);
    return;
  }

  main.innerHTML = `
    <div class="tool-eyebrow">${r.eyebrow}</div>
    <h1 class="tool-heading">${r.heading}</h1>
    <p class="tool-sub">${r.sub}</p>
    <div class="panel" id="panel"></div>
    <div class="route-note">This tab loaded at <code>${window.location.href.split('#')[0]}#/${hash}</code> without a full page reload — each tool still gets its own URL and history entry, so it can be shared, bookmarked, and indexed on its own. On a real deployment, swap the hash routing here for actual static pages or server routes (e.g. <code>/eye-color</code>, <code>/hair</code>) so search engines crawl and rank each one independently.</div>
    <div class="seo-content">${r.seo()}</div>
  `;
  r.render(document.getElementById('panel'));
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);
</script>
