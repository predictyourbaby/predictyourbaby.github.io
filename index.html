<style>
  :root{

      --ink-soft:#A8A497;

  *{box-sizing:border-box;}

  .topbar-inner{max-width:900px;margin:0 auto;padding:18px 24px 0;}
  .brand{display:flex;align-items:baseline;gap:9px;margin-bottom:16px;text-decoration:none;}
  .brand-mark{width:9px;height:9px;border-radius:50%;background:var(--coral);}

  nav{display:flex;gap:2px;overflow-x:auto;}
  nav a{text-decoration:none;color:var(--ink-soft);font-size:0.92rem;padding:10px 16px;border-bottom:2px solid transparent;white-space:nowrap;}

  .btn-row{display:flex;gap:10px;margin-top:8px;}

  .faq-item{margin-bottom:18px;}

  .img-ph{width:100%;aspect-ratio:16/7;border-radius:6px;border:1px dashed var(--line);
    background:var(--card);display:flex;align-items:center;justify-content:center;

<script>
/* ============ IMAGE SLOTS ============
   Replace the src paths below with your own images (open-source or licensed).
   If a file is missing, a labeled placeholder box shows instead. */
const IMG = {
  heroFamily:      {src:"images/family-hero.webp",      alt:"Parents holding a newborn baby"},
  eyeGenetics:     {src:"images/eye-genetics.webp",     alt:"Diagram of eye color inheritance from parents"},
  eyeNewborn:      {src:"images/newborn-eyes.webp",     alt:"Close-up of a newborn baby's eyes"},
  hairGenetics:    {src:"images/hair-genetics.webp",    alt:"Chart of baby hair color inheritance"},
  hairBaby:        {src:"images/baby-hair.webp",        alt:"Baby with light hair"},
  heightChart:     {src:"images/growth-chart.webp",     alt:"Child growth chart showing height percentiles"},
  heightFamily:    {src:"images/measuring-height.webp", alt:"Child being measured against a height chart"},
  genderChart:     {src:"images/gender-chart.webp",     alt:"Traditional Chinese gender prediction chart"},
  genderUltra:     {src:"images/ultrasound.webp",       alt:"Prenatal ultrasound scan image"}
};
function img(key){
  const i = IMG[key];
  return `<div class="img-slot">
    <img src="${i.src}" alt="${i.alt}" loading="lazy"
      onerror="this.outerHTML='<div class=\\'img-ph\\'>Image slot — replace with: ${i.src}</div>'">
    <div class="img-cap">${i.alt}</div>
  </div>`;
}

const colorOptions = ["Brown","Hazel","Green","Blue","Gray","Amber"];
const hairOptions = ["Black","Dark Brown","Light Brown","Blonde","Red"];
const unknownFirst = list => `<option value="">Unknown / not sure</option>` + list.map(c=>`<option value="${c}">${c}</option>`).join('');
const opts = list => list.map(c=>`<option value="${c}">${c}</option>`).join('');

/* ===================== ROUTES ===================== */
const routes = {
  home:        {isHome:true},
  "eye-color": {eyebrow:"Genetics calculator", heading:"Baby eye color calculator",
                sub:"Select both parents' eye colors — and grandparents if you know them — to see the probability of each eye color for your baby.",
                render:toolEyeColor, content:contentEyeColor},
  hair:        {eyebrow:"Genetics calculator", heading:"Baby hair color predictor",
                sub:"Choose each parent's natural hair color to estimate the likely shades your baby could inherit.",
                render:toolHair, content:contentHair},
  height:      {eyebrow:"Growth calculator", heading:"Baby height predictor",
                sub:"Enter both parents' heights to estimate your child's adult height using the mid-parental height method used by pediatricians.",
                render:toolHeight, content:contentHeight},
  gender:      {eyebrow:"For fun", heading:"Baby gender predictor",
                sub:"A lighthearted estimate based on the traditional Chinese gender chart — for fun, not for medical use.",
                render:toolGender, content:contentGender}
};

/* ===================== HOME ===================== */
function renderHome(main){
  main.innerHTML = `
    <div class="hero">
      <h1>Four free calculators to picture your baby</h1>
      <p>Estimate your baby's eye color, hair color, adult height and gender — each tool explained in plain language, free to use, with no signup and nothing stored.</p>
    </div>
    ${img('heroFamily')}
    <div class="tool-grid">
      <a href="#/eye-color" class="tool-card"><div class="tc-title">Eye color calculator</div><div class="tc-desc">Probability of brown, blue, green, hazel, gray and amber eyes from both parents and grandparents.</div></a>
      <a href="#/hair" class="tool-card"><div class="tc-title">Hair color predictor</div><div class="tc-desc">Likely hair shades based on each parent's natural color, including recessive red hair.</div></a>
      <a href="#/height" class="tool-card"><div class="tc-title">Height predictor</div><div class="tc-desc">Projected adult height using the mid-parental height formula, with a realistic range.</div></a>
      <a href="#/gender" class="tool-card"><div class="tc-title">Gender predictor</div><div class="tc-desc">The traditional Chinese gender chart, based on the mother's age and month of conception.</div></a>
    </div>

    <div class="content">
      <h2>What these baby predictor calculators do</h2>
      <p>Every expecting parent wonders the same things. Will the baby have their father's brown eyes or their mother's blue ones? Will that newborn blonde fuzz stay blonde? How tall will they end up? These four calculators give you a structured, genetics-informed estimate for each of those questions in a few seconds, without asking you to register or hand over an email address.</p>
      <p>Each tool works differently because each trait is inherited differently. The eye and hair color calculators apply the dominance hierarchy that geneticists have mapped for pigmentation traits. The height calculator uses the mid-parental height formula that pediatricians have relied on for decades. The gender predictor is openly folklore rather than science, and it's labeled that way throughout.</p>

      <h2>How each calculator works</h2>
      <h3>Eye color</h3>
      <p>Eye color is a polygenic trait, meaning many genes contribute rather than a single on-off switch. The two most influential are <strong>OCA2</strong> and <strong>HERC2</strong>, both located on chromosome 15. OCA2 controls how much melanin gets produced and deposited in the iris, while HERC2 contains a regulatory sequence that determines whether OCA2 is switched on or off. Higher melanin produces brown eyes; very low melanin produces blue and gray through light scattering rather than pigment itself.</p>
      <p>Because recessive alleles can hide for a generation, the eye color calculator also accepts grandparent colors. A brown-eyed father whose own mother had blue eyes carries a meaningfully different genetic profile than a brown-eyed father from an all-brown-eyed family, even though both look identical.</p>

      <h3>Hair color</h3>
      <p>Hair color follows a similar melanin-driven logic. Eumelanin produces black and brown shades; pheomelanin produces red and golden tones. Darker alleles generally dominate lighter ones, which is why two dark-haired parents most often have dark-haired children. Red hair is the notable exception — it's linked to the recessive <strong>MC1R</strong> gene, so it can appear in a child when neither parent has visibly red hair, provided both are carriers.</p>

      <h3>Height</h3>
      <p>Adult height is strongly heritable, with studies attributing roughly 60 to 80 percent of variation to genetics. The mid-parental height method captures this by averaging both parents' heights and adjusting for the child's sex, since adult men are on average about 13 cm taller than adult women. The remaining variation comes from nutrition, sleep, chronic illness, and hormonal factors during the growing years.</p>

      <h3>Gender</h3>
      <p>Biological sex is determined at conception by the sperm's chromosome — X produces a girl, Y produces a boy — and nothing about the mother's age or conception timing influences it. The gender predictor here reproduces the traditional Chinese gender chart because many parents enjoy trying it, but it performs at roughly coin-flip accuracy and is included purely for fun.</p>

      <h2>Why results are shown as probabilities</h2>
      <p>None of these tools return a single definite answer, and that's deliberate. Traits like eye and hair color involve multiple genes whose combined effect can't be read off a parent's appearance alone. Two siblings with the same parents can end up with noticeably different eye colors, because inheritance is decided at random for each individual conception.</p>
      <p>A result showing 65 percent brown means that among many children born to parents with this genetic profile, roughly two out of three would be expected to have brown eyes. It doesn't mean your particular child is 65 percent brown-eyed. Reading these numbers as tendencies rather than predictions is the right way to use them.</p>

      <h2>Accuracy and limitations</h2>
      <ul>
        <li><strong>Self-reported colors are subjective.</strong> One person's "hazel" is another's "light brown." That labeling noise affects any calculator relying on user input.</li>
        <li><strong>Ancestry matters and isn't captured.</strong> Allele frequencies vary substantially between populations, so two brown-eyed parents from different backgrounds can carry very different odds of a light-eyed child.</li>
        <li><strong>Adult appearance can mislead.</strong> Hair especially darkens with age, so a parent's childhood color is the better input where you know it.</li>
        <li><strong>No consumer tool matches genetic testing.</strong> Services analyzing dozens of pigmentation SNPs produce far more precise estimates than any dropdown-based calculator can.</li>
      </ul>

      <h2>Privacy</h2>
      <p>All four calculators run entirely in your browser. Nothing you enter is sent to a server, stored in a database, or connected to any profile. There is no account, no email requirement, and no tracking of the values you select.</p>

      <h2>Frequently asked questions</h2>
      <div class="faq-item"><div class="faq-q">Are these calculators free?</div><p class="faq-a">Yes — all four tools are completely free with no registration, payment, or email required.</p></div>
      <div class="faq-item"><div class="faq-q">How accurate are the predictions?</div><p class="faq-a">They reflect established inheritance patterns but are estimates, not guarantees. The height calculator is the most evidence-based of the four; the gender predictor is folklore and not accurate at all.</p></div>
      <div class="faq-item"><div class="faq-q">Can I use them before the baby is born?</div><p class="faq-a">Yes. The eye, hair and height tools only need information about the parents, so you can use them at any point — including before conception.</p></div>
      <div class="faq-item"><div class="faq-q">Do they work on mobile?</div><p class="faq-a">Yes, all tools are fully responsive and work in any modern mobile or desktop browser without an app.</p></div>
      <div class="faq-item"><div class="faq-q">Should these results influence medical decisions?</div><p class="faq-a">No. These are educational and entertainment tools. For anything involving genetic conditions or pregnancy planning, speak with a doctor or genetic counselor.</p></div>
    </div>

    <footer>© 2026 predictyourbaby · Educational and entertainment use only · Not medical advice</footer>
  `;
}

/* ===================== TOOLS ===================== */
function toolEyeColor(c){
  c.innerHTML = `
    <div class="sub-label">Parents</div>
    <div class="field-row">
      <div><label for="p1">Father's eye color</label><select id="p1">${opts(colorOptions)}</select></div>
      <div><label for="p2">Mother's eye color</label><select id="p2">${opts(colorOptions)}</select></div>
    </div>
    <div class="sub-label">Grandparents (optional — improves accuracy)</div>
    <div class="field-row">
      <div><label for="g1">Paternal grandfather</label><select id="g1">${unknownFirst(colorOptions)}</select></div>
      <div><label for="g2">Paternal grandmother</label><select id="g2">${unknownFirst(colorOptions)}</select></div>
    </div>
    <div class="field-row">
      <div><label for="g3">Maternal grandfather</label><select id="g3">${unknownFirst(colorOptions)}</select></div>
      <div><label for="g4">Maternal grandmother</label><select id="g4">${unknownFirst(colorOptions)}</select></div>
    </div>
    <div class="btn-row"><button class="go" id="calc">Calculate</button><button class="reset" id="rst">Reset</button></div>
    <div class="result" id="result">
      <div class="result-label">Estimated probability of each eye color</div>
      <div id="bars"></div>
      <div class="disclaimer">Based on general dominance patterns across the OCA2 and HERC2 genes. Eye color is polygenic — treat this as an educated estimate, not a guarantee.</div>
    </div>`;
  document.getElementById('p2').selectedIndex = 3;
  document.getElementById('rst').onclick = () => { toolEyeColor(c); };
  document.getElementById('calc').onclick = () => {
    const dominance = {Brown:6, Amber:5, Hazel:4, Green:3, Blue:2, Gray:1};
    const pool = [];
    ['p1','p2'].forEach(id=>{ const v=document.getElementById(id).value; if(v){pool.push(v);pool.push(v);} });
    ['g1','g2','g3','g4'].forEach(id=>{ const v=document.getElementById(id).value; if(v) pool.push(v); });
    const freq = {}; colorOptions.forEach(k=>freq[k]=0);
    pool.forEach(v=>freq[v]++);
    const weights = {};
    colorOptions.forEach(k=>{
      weights[k] = (freq[k] * (1 + dominance[k]*0.35)) + 0.35;
    });
    showBars(weights, colorOptions, {Brown:"#6B4423",Hazel:"#8B723A",Green:"#5F7A4A",Blue:"#4A6E8F",Gray:"#7E8288",Amber:"#B9852F"});
  };
}

function toolHair(c){
  c.innerHTML = `
    <div class="sub-label">Parents</div>
    <div class="field-row">
      <div><label for="h1">Father's natural hair color</label><select id="h1">${opts(hairOptions)}</select></div>
      <div><label for="h2">Mother's natural hair color</label><select id="h2">${opts(hairOptions)}</select></div>
    </div>
    <div class="sub-label">Grandparents (optional)</div>
    <div class="field-row">
      <div><label for="hg1">Paternal side</label><select id="hg1">${unknownFirst(hairOptions)}</select></div>
      <div><label for="hg2">Maternal side</label><select id="hg2">${unknownFirst(hairOptions)}</select></div>
    </div>
    <div class="btn-row"><button class="go" id="calc">Calculate</button><button class="reset" id="rst">Reset</button></div>
    <div class="result" id="result">
      <div class="result-label">Estimated probability of each hair color</div>
      <div id="bars"></div>
      <div class="disclaimer">Use each parent's childhood hair color where known — hair commonly darkens with age, which can skew results lighter than reality.</div>
    </div>`;
  document.getElementById('h2').selectedIndex = 3;
  document.getElementById('rst').onclick = () => { toolHair(c); };
  document.getElementById('calc').onclick = () => {
    const dominance = {Black:5,"Dark Brown":4,"Light Brown":3,Blonde:1,Red:1};
    const pool = [];
    ['h1','h2'].forEach(id=>{const v=document.getElementById(id).value; if(v){pool.push(v);pool.push(v);}});
    ['hg1','hg2'].forEach(id=>{const v=document.getElementById(id).value; if(v) pool.push(v);});
    const freq={}; hairOptions.forEach(k=>freq[k]=0);
    pool.forEach(v=>freq[v]++);
    const weights={};
    hairOptions.forEach(k=>{ weights[k] = (freq[k]*(1+dominance[k]*0.4)) + 0.3; });
    if(freq['Red']>0) weights['Red'] += 1.2;
    showBars(weights, hairOptions, {Black:"#2B2724","Dark Brown":"#4A342A","Light Brown":"#8A6440",Blonde:"#C9A961",Red:"#A65232"});
  };
}

function toolHeight(c){
  c.innerHTML = `
    <div class="field-row">
      <div><label for="mh">Mother's height (cm)</label><input type="number" id="mh" placeholder="e.g. 162" min="120" max="210"></div>
      <div><label for="fh">Father's height (cm)</label><input type="number" id="fh" placeholder="e.g. 177" min="120" max="220"></div>
    </div>
    <div class="field-row">
      <div><label for="sex">Baby's sex</label><select id="sex"><option value="boy">Boy</option><option value="girl">Girl</option></select></div>
      <div></div>
    </div>
    <div class="btn-row"><button class="go" id="calc">Calculate</button><button class="reset" id="rst">Reset</button></div>
    <div class="result" id="result">
      <div class="result-label">Estimated adult height</div>
      <div class="big-result" id="hres"></div>
      <div id="hrange" style="color:var(--ink-soft);font-size:0.92rem;"></div>
      <div class="disclaimer">Mid-parental height method. About 68% of children fall within ±8.5 cm of this estimate. Nutrition, health and hormonal factors also affect final height.</div>
    </div>`;
  document.getElementById('rst').onclick = () => { toolHeight(c); };
  document.getElementById('calc').onclick = () => {
    const mh = parseFloat(document.getElementById('mh').value);
    const fh = parseFloat(document.getElementById('fh').value);
    if(!mh || !fh) return;
    const sex = document.getElementById('sex').value;
    const est = sex==='boy' ? (mh+fh)/2 + 6.5 : (mh+fh)/2 - 6.5;
    const ft = v => `${Math.floor(v/30.48)}′${Math.round((v/2.54)%12)}″`;
    document.getElementById('hres').textContent = `${est.toFixed(0)} cm  (${ft(est)})`;
    document.getElementById('hrange').textContent = `Likely range: ${(est-8.5).toFixed(0)}–${(est+8.5).toFixed(0)} cm (${ft(est-8.5)} – ${ft(est+8.5)})`;
    document.getElementById('result').classList.add('show');
  };
}

function toolGender(c){
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  c.innerHTML = `
    <div class="field-row">
      <div><label for="age">Mother's age at conception</label><input type="number" id="age" placeholder="e.g. 29" min="15" max="55"></div>
      <div><label for="month">Month of conception</label><select id="month">${months.map(m=>`<option>${m}</option>`).join('')}</select></div>
    </div>
    <div class="btn-row"><button class="go" id="calc">Calculate</button><button class="reset" id="rst">Reset</button></div>
    <div class="result" id="result">
      <div class="result-label">Traditional chart result</div>
      <div class="big-result" id="gres"></div>
      <div class="disclaimer">This is the traditional Chinese gender chart — folklore, not science. It performs at roughly chance level. For an accurate answer, an ultrasound (typically 18–20 weeks) or a blood test ordered by your doctor is the reliable route.</div>
    </div>`;
  document.getElementById('rst').onclick = () => { toolGender(c); };
  document.getElementById('calc').onclick = () => {
    const age = parseInt(document.getElementById('age').value);
    if(!age) return;
    const month = document.getElementById('month').selectedIndex + 1;
    document.getElementById('gres').textContent = (age+month)%2===0 ? "Boy" : "Girl";
    document.getElementById('result').classList.add('show');
  };
}

function showBars(weights, order, colors){
  const total = Object.values(weights).reduce((a,b)=>a+b,0);
  document.getElementById('bars').innerHTML = order
    .map(k=>({name:k, val: total ? (weights[k]/total)*100 : 0}))
    .sort((a,b)=>b.val-a.val)
    .map(b=>`<div class="bar-row">
        <div class="bar-name">${b.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${b.val.toFixed(1)}%;background:${colors[b.name]}"></div></div>
        <div class="bar-pct">${b.val.toFixed(1)}%</div>
      </div>`).join('');
  document.getElementById('result').classList.add('show');
}

    <p>The 6.5 cm adjustment accounts for the average adult height difference between the sexes. The result is a midpoint, and roughly 68 percent of children end up within about 8.5 cm either side of it — which is why the calculator reports a range rather than a single number.</p>
    <p>That range is wide on purpose. A boy with an estimate of 178 cm could reasonably land anywhere between about 170 and 187 cm, and all of those outcomes are entirely normal. Treating the midpoint as a target rather than a midpoint is the most common way people misread this calculation.</p>

    <p>The remaining 20 to 40 percent comes from environment. Nutrition during the growing years is the largest factor, particularly adequate protein, calcium, vitamin D and overall caloric sufficiency. Chronic illness, untreated hormonal conditions, severe sleep deprivation and persistent early-childhood malnutrition can all keep a child below their genetic potential.</p>

    <p>Growth isn't steady along the way. Infants grow around 25 cm in their first year, then slow to roughly 5 to 6 cm per year through middle childhood, before the pubertal growth spurt adds 8 to 12 cm per year at its peak. A child who seems short relative to peers may simply be a later developer.</p>
    <p>If a child's growth crosses downward through percentile lines on a standard growth chart, or if they're growing under about 4 cm a year in mid-childhood, that's worth raising with a pediatrician — regardless of what this calculator estimates.</p>

function contentGender(){
  return `
    <h2>How to use the baby gender predictor</h2>
    <ol>
      <li><strong>Enter the mother's age at conception</strong> in years.</li>
      <li><strong>Select the month of conception</strong> — this is roughly two weeks after the last period, not the month of the positive test.</li>
      <li><strong>Press Calculate</strong> to see the chart's result.</li>
    </ol>
    <p>Before going further: this tool is entertainment. It reproduces a traditional folk chart because many parents enjoy trying it, but it has no scientific basis and no predictive power. If you want to actually know, an ultrasound or a prenatal blood test through your doctor is the answer.</p>
    ${img('genderChart')}

    <h2>Where the Chinese gender chart comes from</h2>
    <p>The chart is said to date back several centuries, with the popular origin story describing it being recovered from a royal tomb near Beijing. It cross-references the mother's lunar age against the lunar month of conception to produce a boy-or-girl result. Versions of it circulate widely in pregnancy forums, baby books and apps.</p>
    <p>The historical claims around it are unverified, and no mechanism has ever been proposed by which a mother's age or the calendar month could influence which sperm fertilizes the egg. Studies examining its accuracy against actual birth outcomes have found it performs at approximately chance — about the same as flipping a coin. That's the honest framing, and it's worth knowing before anyone repaints a nursery based on it.</p>

    <h2>What actually determines a baby's sex</h2>
    <p>Biological sex is decided at the moment of fertilization by a single chromosome. The mother's egg always carries an X chromosome. The father's sperm carries either an X or a Y. An X-carrying sperm produces a girl (XX); a Y-carrying sperm produces a boy (XY).</p>
    <p>This means the father's sperm determines the outcome, and it's essentially a coin flip at conception — roughly 51 percent of births are boys, a slight and consistent global skew. Nothing about the mother's age, the month, her diet, the timing of intercourse, or any of the traditional folk methods changes which sperm arrives first.</p>

    <h3>Old wives' tales you'll hear</h3>
    <ul>
      <li><strong>Bump shape.</strong> Carrying high or low reflects muscle tone, the baby's position and the mother's build — not sex.</li>
      <li><strong>Fetal heart rate.</strong> The claim that above 140 bpm means a girl has been tested repeatedly and doesn't hold up. Heart rate varies by gestational age and activity.</li>
      <li><strong>Morning sickness severity.</strong> Some studies find a very weak association with girls, but the effect is far too small to predict any individual pregnancy.</li>
      <li><strong>Food cravings.</strong> No evidence links sweet-versus-salty cravings to sex.</li>
      <li><strong>The ring test.</strong> A wedding ring on a string swings according to tiny involuntary hand movements, not the baby.</li>
    </ul>

    <h2>How to actually find out your baby's sex</h2>
    ${img('genderUltra')}
    <p><strong>Ultrasound</strong> is the most common route. Anatomy scans done around 18 to 20 weeks can usually identify sex with high accuracy, though it depends on the baby's position — a baby facing the wrong way may keep it a mystery until the next scan. Some clinics attempt earlier assessments around 14 to 16 weeks with lower reliability.</p>
    <p><strong>Non-invasive prenatal testing (NIPT)</strong> is a maternal blood test that analyzes fetal DNA circulating in the mother's bloodstream. It can typically determine sex from around 10 weeks with very high accuracy. Its primary medical purpose is screening for chromosomal conditions; sex information is a secondary result. Availability and cost vary by country and provider.</p>
    <p><strong>Diagnostic procedures</strong> such as amniocentesis and CVS determine sex definitively, but they carry small procedural risks and are only performed for genuine medical indications — never for curiosity about sex.</p>
    <p>Which of these are available to you depends on where you live and your provider. Your doctor or midwife is the right person to ask about options and timing.</p>

    <h2>Frequently asked questions</h2>
    <div class="faq-item"><div class="faq-q">Is the Chinese gender chart accurate?</div><p class="faq-a">No. Studies find it performs at roughly chance level — comparable to guessing. It's a tradition, not a method.</p></div>
    <div class="faq-item"><div class="faq-q">Can anything influence whether I have a boy or girl?</div><p class="faq-a">No natural method has been shown to work. Sex is determined by which sperm fertilizes the egg, which is effectively random.</p></div>
    <div class="faq-item"><div class="faq-q">When is the earliest I can know?</div><p class="faq-a">A prenatal blood test can often determine sex from around 10 weeks; ultrasound typically from 18 to 20 weeks. Ask your provider what's available to you.</p></div>
    <div class="faq-item"><div class="faq-q">Why does the chart sometimes seem right?</div><p class="faq-a">With only two possible outcomes, any method is right about half the time. People remember the hits and forget the misses.</p></div>
    <div class="faq-item"><div class="faq-q">Are boys or girls more common?</div><p class="faq-a">Slightly more boys are born globally — roughly 105 boys per 100 girls — a small, consistent and long-observed skew.</p></div>
  `;
}

function renderRoute(){
  let hash = window.location.hash.replace('#/','') || 'home';
  if(!routes[hash]) hash = 'home';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===hash));
  const r = routes[hash];
  const main = document.getElementById('main');
  window.scrollTo(0,0);

  if(r.isHome){ renderHome(main); return; }

  main.innerHTML = `
    <div class="tool-eyebrow">${r.eyebrow}</div>
    <h1 class="tool-heading">${r.heading}</h1>
    <p class="tool-sub">${r.sub}</p>
    <div class="panel" id="panel"></div>
    <div class="route-note">Loaded at <code>#/${hash}</code> with no page reload — each tool keeps its own URL and history entry. On your live site, replace this hash routing with real pages or server routes (<code>/${hash}</code>) so Google indexes and ranks each tool separately.</div>
    <div class="content">${r.content()}</div>
    <footer>© 2026 predictyourbaby · Educational and entertainment use only · Not medical advice</footer>
  `;
  r.render(document.getElementById('panel'));
}
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);
