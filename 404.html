<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
  var path = location.pathname;
  var search = location.search ? location.search.slice(1) : '';
  var hash = location.hash;
  var params = new URLSearchParams(search);
  params.set('p', path);
  location.replace('/?' + params.toString() + hash);
</script>
</head>
<body>
Redirecting…
</body>
</html>
